
name: Compilar APK TecnoCheck

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Encontrar proyecto
        shell: bash
        run: |
          PUBSPEC=$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "No se encontró pubspec.yaml"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Crear estructura Android
        run: |
          rm -rf android
          flutter create --platforms=android --project-name tecnocheck .

        working-directory: ${{ env.PROJECT_DIR }}

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Compilar APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoCheck-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
